[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-jax"
version = "0.2.0"
description = "Continuous normalizing flows in JAX: ODE/SDE integration of learnable vector fields, push-forward densities and divergence estimators."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Alexander Telfar", email = "te1farac@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Intended Audience :: Science/Research",
]
dependencies = ["numpy", "jax", "equinox", "diffrax"]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/act65/flow"

[tool.setuptools.packages.find]
include = ["flow*"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "expensive: marks tests as expensive (run with '--run-expensive')",
]
